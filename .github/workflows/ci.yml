name: Build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test language and persistence
        run: npm test
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
