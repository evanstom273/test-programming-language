name: Build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test language and persistence
        run: npm test
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Install Chromium for PWA checks
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows
        run: npm run test:e2e
      - name: Check production PWA and offline restart
        run: npm run test:pwa

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build and package desktop extension
        run: npm run vscode:package
      - name: Test packaged extension in VS Code
        run: xvfb-run -a npm run test:vscode
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: language-lab-vsix
          path: language-lab.vsix
      - name: Build playable Emberfall example
        run: node scripts/build-emberfall.mjs
      - name: Upload game and editable project
        uses: actions/upload-artifact@v4
        with:
          name: emberfall-game
          path: dist/emberfall/
